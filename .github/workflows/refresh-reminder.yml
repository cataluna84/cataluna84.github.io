name: Monthly content refresh reminder

# The portfolio's competition placements, ranks and run counts are hardcoded in
# script.js, and scripts/extract_kaggle.py needs Kaggle and W&B credentials that
# are deliberately not stored as repository secrets. So this reminds rather than
# automates.
#
# It also cross-checks the generated stats block in cataluna84/cataluna84. That
# repo refreshes itself monthly, but GitHub disables scheduled workflows after 60
# days of repository inactivity, which fails silently. A second schedule in a
# different repository catches that.

on:
  schedule:
    # 05:23 UTC on the 2nd of each month, a day after the profile stats refresh.
    - cron: "23 5 2 * *"
  workflow_dispatch:

# contents: read is required, not optional: naming `permissions` at all sets every
# scope not listed here to none, which would make actions/checkout fail.
permissions:
  contents: read
  issues: write

concurrency:
  group: refresh-reminder
  cancel-in-progress: true

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the profile stats block has gone stale
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read through the API, not raw.githubusercontent.com, which serves a
          # CDN-cached copy for several minutes after a push.
          generated=$(gh api repos/cataluna84/cataluna84/contents/README.md \
            -H "Accept: application/vnd.github.raw" \
            | grep -oP '(?<=<!-- STATS:GENERATED )\d{4}-\d{2}-\d{2}' || true)

          if [ -z "$generated" ]; then
            echo "note=Could not read the STATS:GENERATED marker in cataluna84/cataluna84. The stats block may have been edited by hand." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          age=$(( ( $(date +%s) - $(date -d "$generated" +%s) ) / 86400 ))
          echo "Profile stats generated $generated ($age days ago)"

          if [ "$age" -gt 40 ]; then
            echo "note=Profile stats in cataluna84/cataluna84 are $age days old (generated $generated). The monthly workflow there may be disabled: GitHub turns off schedules after 60 days of repo inactivity. Check its Actions tab." >> "$GITHUB_OUTPUT"
          fi

      - name: Check the content files for drift
        id: sync
        run: |
          # Offline and credential-free. Network link checking is deliberately not
          # enabled here: third-party hosts rate-limit CI runners, which would turn
          # this into a flaky monthly false alarm.
          if python3 scripts/check_content_sync.py > "$RUNNER_TEMP/drift.txt" 2>&1; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=drift" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/drift.txt"

      - name: Open or update the reminder issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set explicitly so this keeps working regardless of checkout state.
          GH_REPO: ${{ github.repository }}
          DRIFT_STATUS: ${{ steps.sync.outputs.status }}
        run: |
          gh label create content-refresh --color 0e8a16 \
            --description "Recurring portfolio content refresh" --force || true

          body=$(cat <<'EOF'
          Monthly reminder to refresh the hardcoded portfolio content.

          These are hand-maintained in `script.js` and drift out of date:

          - `kaggleCompetitions` — placements and totals
          - Kaggle profile rank and medal counts
          - ARC Prize standings
          - HuggingFace model count and W&B run counts

          Pull current figures:

          ```bash
          set -a; . ./.env; set +a
          uv run python scripts/extract_kaggle.py
          ```

          Then keep the three sources in sync, with `mayank_bhaskar_projects.md` as
          the source of truth:

          - `mayank_bhaskar_projects.md` (source of truth)
          - `script.js` (the site)
          - `mayank_bhaskar_resume.html`

          Verify before committing:

          ```bash
          python3 scripts/check_content_sync.py           # figures agree
          python3 scripts/check_content_sync.py --links   # plus link liveness
          ```

          Close this issue once done. A new one opens next month.
          EOF
          )

          note="${{ steps.check.outputs.note }}"
          if [ -n "$note" ]; then
            body="$body"$'\n\n'"> [!WARNING]"$'\n'"> $note"
          fi

          # Read the report from a file rather than a step output: a GitHub
          # expression would inject multi-line text straight into this script.
          # (The literal expression syntax cannot even appear in this comment,
          # since the workflow parser scans the whole file for it.)
          if [ "$DRIFT_STATUS" = "drift" ]; then
            body="$body"$'\n\n'"> [!CAUTION]"$'\n'"> \`check_content_sync.py\` reports the content files disagree:"$'\n\n'"\`\`\`"$'\n'"$(cat "$RUNNER_TEMP/drift.txt")"$'\n'"\`\`\`"
          fi

          existing=$(gh issue list --label content-refresh --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Reminder #$existing is still open; adding a note instead of duplicating."
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Refresh portfolio stats and placements" \
              --label content-refresh --body "$body"
          fi
